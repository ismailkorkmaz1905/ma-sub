name: Qualify A-Z delivery repairs
on:
  push:
    branches: [main]
    paths: ['.audit-stage/**', '.github/workflows/audit-repair.yml']
permissions:
  contents: write
concurrency:
  group: ma-sub-authorized-az-repair
  cancel-in-progress: false
jobs:
  qualify:
    if: "!contains(github.event.head_commit.message, '[audit-cleanup]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core
          pip install -r requirements-ci.lock
          pip install --no-deps -e .
      - name: Apply exact locally tested patch
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, os, subprocess
          from pathlib import Path
          encoded = ''.join(Path(f'.audit-stage/chunk-{i}.b64').read_text() for i in range(3))
          compressed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == 'b9264d7994cba6f1d9ceaf05afb47214204b0077387a950ba218fc7bc4416246'
          patch = lzma.decompress(compressed)
          assert len(patch) == 101321
          assert hashlib.sha256(patch).hexdigest() == 'f2e8db29a6c1e00e0237ce02455f63e1f2ad838e2e7c804eda1af384522a3a47'
          path = Path(os.environ['RUNNER_TEMP']) / 'reviewed-repair.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--index', '--check', '--unidiff-zero', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', '--unidiff-zero', str(path)], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          PY
      - name: Real validators and synthetic media without external networking or GPU
        env:
          CUDA_VISIBLE_DEVICES: '-1'
          NVIDIA_VISIBLE_DEVICES: none
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python_path="$(command -v python)"
          sudo --preserve-env=CUDA_VISIBLE_DEVICES,NVIDIA_VISIBLE_DEVICES,HF_HUB_OFFLINE,TRANSFORMERS_OFFLINE,PYTEST_DISABLE_PLUGIN_AUTOLOAD,PYTHONDONTWRITEBYTECODE unshare --net -- bash -c 'ip link set lo up; exec runuser -u runner -- "$@"' -- "$python_path" -m pytest -q -ra -m 'not gpu' tests
          for script in runpod/*.sh; do bash -n "$script"; done
      - name: Commit only verified source and tests to main
        run: |
          python - <<'PY'
          import subprocess
          allowed = {'README.md', 'docs/ASTRA_HANDOFF.md', 'docs/AZ_REPAIR_2026-09-16.md', 'docs/CODEX_HANDOFF.md', 'src/mas/delivery_first.py', 'src/mas/drive_resumable.py', 'src/mas/engine/delivery_align.py', 'src/mas/engine/delivery_coverage.py', 'src/mas/engine/id_translation.py', 'src/mas/engine/part_audio.py', 'src/mas/engine/part_scope.py', 'src/mas/engine/partial_encode.py', 'src/mas/partial_delivery.py', 'src/mas/remote.py', 'src/mas/runpod_controller.py', 'tests/engine/test_burned_mp4.py', 'tests/engine/test_delivery_audit_regressions.py', 'tests/engine/test_delivery_first.py', 'tests/test_delivery.py', 'tests/test_drive_resumable.py', 'tests/test_pipeline_runtime.py'}
          actual = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          assert actual == allowed, (actual, allowed)
          subprocess.run(['git', 'diff', '--exit-code'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          PY
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Repair delivery-first speech gaps, timing, authenticated resume and idempotent Drive uploads'
          git push origin HEAD:refs/heads/main
          echo "TESTED_COMMIT=$(git rev-parse HEAD)"
          echo "TESTED_TREE=$(git rev-parse HEAD^{tree})"
