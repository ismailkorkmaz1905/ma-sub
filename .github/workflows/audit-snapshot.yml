name: Audit source snapshot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive exact checked-out source
        run: |
          mkdir -p "$RUNNER_TEMP/mas-snapshot"
          git archive --format=tar.gz --output="$RUNNER_TEMP/mas-snapshot/ma-sub-audit-source.tar.gz" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/mas-snapshot/COMMIT"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/mas-snapshot/TREE"
          git ls-tree -r HEAD > "$RUNNER_TEMP/mas-snapshot/FILES"
          cd "$RUNNER_TEMP/mas-snapshot"
          sha256sum ma-sub-audit-source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ma-sub-audit-source
          path: ${{ runner.temp }}/mas-snapshot/
          retention-days: 7
