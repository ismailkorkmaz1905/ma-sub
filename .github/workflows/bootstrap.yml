name: bootstrap-ma-sub

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.head_commit.message != 'Expand validated V2 production tree'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.13'
      - name: Decode and expand repository payload
        shell: bash
        run: |
          set -euo pipefail
          test -f bootstrap/READY
          python - <<'PY'
          from pathlib import Path
          p = Path('bootstrap/essential.part-11')
          raw = p.read_bytes()
          allowed = set(b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=\r\n')
          bad = [(i, b) for i, b in enumerate(raw) if b not in allowed]
          print(f'part11_bytes={len(raw)} invalid_base64_bytes={bad[:20]} count={len(bad)}')
          PY
          cat bootstrap/essential.part-* \
            | tr -cd 'A-Za-z0-9+/=\n\r' \
            | base64 -d > /tmp/ma-sub.tar.xz
          xz -t /tmp/ma-sub.tar.xz
          tar -xJf /tmp/ma-sub.tar.xz -C .
          chmod +x mas runpod/preflight.sh runpod/start.sh runpod/bootstrap.sh
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap.yml
      - name: Regression test
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check PyYAML==6.0.2 openpyxl==3.1.5 pytest==8.3.5
          python -m compileall -q src tools tests
          python -m pytest -q
      - name: Commit expanded tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ma-sub bootstrap'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Expand validated V2 production tree'
          git push origin HEAD:main
