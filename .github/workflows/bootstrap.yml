name: expand-v2-production-baseline

on:
  push:
    branches: [engineering/ep12-reliability]

permissions:
  contents: write

jobs:
  expand:
    if: github.event.head_commit.message != 'Expand V2 production baseline'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11.13'}
      - name: Recover validated bootstrap payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, subprocess
          essential = sorted(Path('bootstrap').glob('essential.part-*'))
          payload = sorted(Path('bootstrap').glob('payload.part-*'))
          groups = [
              ('essential', essential),
              ('essential_payload', essential + payload),
              ('payload_essential', payload + essential),
          ]
          chosen = None
          for name, parts in groups:
              text = ''.join(''.join(p.read_text().split()) for p in parts)
              try:
                  raw = base64.b64decode(text)
              except Exception as exc:
                  print(name, 'decode-fail', exc)
                  continue
              candidate = Path('/tmp') / f'{name}.tar.xz'
              candidate.write_bytes(raw)
              rc = subprocess.run(['xz','-t',str(candidate)]).returncode
              print(name, len(raw), 'xz_rc', rc)
              if rc == 0:
                  chosen = candidate
                  break
          if chosen is None:
              for name, parts in groups:
                  raw = b''
                  ok = True
                  for p in parts:
                      try: raw += base64.b64decode(''.join(p.read_text().split()))
                      except Exception as exc:
                          print(name, p.name, 'piece-decode-fail', exc); ok=False; break
                  if not ok: continue
                  candidate = Path('/tmp') / f'{name}-piecewise.tar.xz'
                  candidate.write_bytes(raw)
                  rc = subprocess.run(['xz','-t',str(candidate)]).returncode
                  print(name+'-piecewise', len(raw), 'xz_rc', rc)
                  if rc == 0:
                      chosen = candidate
                      break
          if chosen is None:
              raise SystemExit('NO_VALID_BOOTSTRAP_COMBINATION')
          Path('/tmp/ma-sub.tar.xz').write_bytes(chosen.read_bytes())
          PY
      - name: Replace branch with exact baseline
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xJf /tmp/ma-sub.tar.xz -C .
          chmod +x mas runpod/*.sh 2>/dev/null || true
      - name: Regression test baseline
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check PyYAML==6.0.2 openpyxl==3.1.5 pytest==8.3.5
          python -m compileall -q src cli tests
          python -m pytest -q
      - name: Commit exact baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ma-sub engineering'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Expand V2 production baseline'
          git push origin HEAD:${GITHUB_REF_NAME}
