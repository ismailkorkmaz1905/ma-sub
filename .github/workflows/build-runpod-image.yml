name: Build immutable RunPod image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ma-sub-runpod-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Free runner space for CUDA layers
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          docker system prune --all --force
          df -h /

      - name: Build and push immutable runtime
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ma-sub-runpod:${{ github.sha }}
          provenance: false

      - name: Record immutable image identity
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/ma-sub-runpod@${{ steps.build.outputs.digest }}"
          printf '### Immutable RunPod image\n\n`%s`\n' "$image" >> "$GITHUB_STEP_SUMMARY"
