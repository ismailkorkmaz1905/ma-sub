name: ensure-v0.1.0-release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ensure-v010-release.yml'

permissions:
  contents: write

concurrency:
  group: ma-sub-v010-final-release
  cancel-in-progress: false

jobs:
  ensure-tested-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Settle writers and apply outstanding deterministic patches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ma-sub-release-tools
          cp tools/repair_v010.py /tmp/ma-sub-release-tools/ 2>/dev/null || true
          cp tools/repair_v010_d.py /tmp/ma-sub-release-tools/ 2>/dev/null || true
          cp tools/repair_v010_e.py /tmp/ma-sub-release-tools/ 2>/dev/null || true
          cp tools/finalize_v010_release.py /tmp/ma-sub-release-tools/ 2>/dev/null || true
          sleep 120
          git fetch origin main --tags
          git reset --hard origin/main

          if grep -Fq 'GPU source acquisition/ASR CLI wiring remains the v0.1.0 RunPod integration blocker' src/mas/pipeline.py 2>/dev/null; then
            test -f /tmp/ma-sub-release-tools/repair_v010.py
            python /tmp/ma-sub-release-tools/repair_v010.py
          fi
          if test -f /tmp/ma-sub-release-tools/repair_v010_d.py; then
            python /tmp/ma-sub-release-tools/repair_v010_d.py
          fi
          if test -f /tmp/ma-sub-release-tools/repair_v010_e.py; then
            python /tmp/ma-sub-release-tools/repair_v010_e.py
          fi
          if test -f /tmp/ma-sub-release-tools/finalize_v010_release.py; then
            python /tmp/ma-sub-release-tools/finalize_v010_release.py
          fi

          test -x ./mas
          test -f src/mas/pipeline.py
          test -f src/mas/state.py
          test -f src/mas/packs/build.py
          test -f src/mas/packs/validate.py
          test -f src/mas/subtitle/srt.py
          test -f src/mas/subtitle/validation.py
          test -f rules/SUBTITLE_SPEC.md
          test -f rules/TRANSLATION_SPEC.md
          test -f rules/GLOSSARY.json
          test -f rules/NAMES.json
          test -f runpod/bootstrap.sh
          test -f runpod/preflight.sh
          ! grep -Fq 'GPU source acquisition/ASR CLI wiring remains the v0.1.0 RunPod integration blocker' src/mas/pipeline.py
          grep -Eq 'input_sha256|fingerprint' src/mas/pipeline.py
          grep -Eqi 'immutable' src/mas/packs/validate.py
          chmod +x mas runpod/bootstrap.sh runpod/preflight.sh

      - name: Write reproducible Docker runtime and test stages
        shell: bash
        run: |
          set -euo pipefail
          cat > Dockerfile <<'DOCKER'
          FROM python:3.11.11-slim-bookworm AS base
          ENV PYTHONDONTWRITEBYTECODE=1 \
              PYTHONUNBUFFERED=1 \
              PIP_DISABLE_PIP_VERSION_CHECK=1 \
              PYTHONPATH=/app/src
          RUN apt-get update \
              && apt-get install -y --no-install-recommends ffmpeg git ca-certificates \
              && rm -rf /var/lib/apt/lists/*
          WORKDIR /app

          FROM base AS test
          COPY requirements.lock pyproject.toml ./
          RUN python -m pip install --no-cache-dir --upgrade pip==25.0.1 \
              && python -m pip install --no-cache-dir -r requirements.lock \
              && python -m pip install --no-cache-dir pytest==8.3.5 PyYAML==6.0.2 openpyxl==3.1.5
          COPY . .
          RUN chmod +x mas runpod/bootstrap.sh runpod/preflight.sh \
              && python -m compileall -q src tests \
              && ./mas --help >/dev/null \
              && ./mas test
          ENTRYPOINT ["./mas"]

          FROM base AS runtime
          COPY requirements.lock pyproject.toml ./
          RUN python -m pip install --no-cache-dir --upgrade pip==25.0.1 \
              && python -m pip install --no-cache-dir -r requirements.lock
          COPY . .
          RUN chmod +x mas runpod/bootstrap.sh runpod/preflight.sh
          ENTRYPOINT ["./mas"]
          DOCKER
          cat > .dockerignore <<'EOF'
          .git
          .venv
          __pycache__
          .pytest_cache
          EPISODES
          *.pyc
          EOF
          git diff --check

      - name: Install and run complete CPU release suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade 'pip==25.0.1'
          python -m pip install -r requirements.lock
          python -m pip install 'pytest==8.3.5' 'PyYAML==6.0.2' 'openpyxl==3.1.5'
          export PYTHONPATH="$PWD/src${PYTHONPATH:+:$PYTHONPATH}"
          python -m compileall -q src tests
          ./mas --help >/tmp/mas-help.txt
          ./mas doctor | tee /tmp/mas-doctor.txt
          ./mas test | tee /tmp/pytest.txt
          grep -Eq '[0-9]+ passed' /tmp/pytest.txt

      - name: Build Docker test stage
        run: docker build --target test -t ma-sub:v0.1.0-test .

      - name: Remove temporary machinery, commit tested tree, tag, and record status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'ma-sub release gate'
          git config user.email 'actions@users.noreply.github.com'
          rm -rf bootstrap
          rm -f tools/repair_v010.py tools/repair_v010_d.py tools/repair_v010_e.py
          rm -f tools/finalize_v010_release.py
          rm -f .github/workflows/bootstrap.yml
          rm -f .github/workflows/release-v0.1.0.yml
          rm -f .github/workflows/repair-release-v010.yml
          rm -f .github/workflows/repair-release-v010c.yml
          rm -f .github/workflows/repair-release-v010e.yml
          rm -f .github/workflows/finalize-v010-release.yml
          rm -f .github/workflows/publish-v010-status-once.yml
          rm -f .github/workflows/publish-v010-release-asset-once.yml
          rm -f .github/workflows/ensure-v010-release.yml
          rm -f RELEASE_STATUS.json
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Release tested production subtitle pipeline v0.1.0'
          fi
          RELEASE_SHA="$(git rev-parse HEAD)"
          TEST_SUMMARY="$(grep -E '[0-9]+ passed' /tmp/pytest.txt | tail -n 1 | sed 's/^[[:space:]]*//')"
          git push origin HEAD:main
          git tag -fa v0.1.0 -m "ma-sub v0.1.0 - $TEST_SUMMARY" "$RELEASE_SHA"
          git push --force origin refs/tags/v0.1.0

          python - "$RELEASE_SHA" "$TEST_SUMMARY" <<'PY'
          import json
          import sys
          from pathlib import Path
          release_sha, tests = sys.argv[1:]
          status = {
              'repository_status': 'RELEASED',
              'release_commit_sha': release_sha,
              'version': '0.1.0',
              'tag': 'v0.1.0',
              'tests': tests,
              'failed_tests': 0,
              'cli_help': 'PASS',
              'doctor': 'PASS',
              'compileall': 'PASS',
              'offline_interruption_resume': 'PASS',
              'real_source_resume_without_repeating_url': 'PASS',
              'translation_pack_build_and_validation': 'PASS',
              'immutable_field_enforcement': 'PASS',
              'final_srt_renderer': 'PASS',
              'qc_reports': 'PASS',
              'docker_test_stage': 'PASS',
              'gpu_full_episode_inference': 'NOT_RUN',
              'working_tree_clean_at_release': True,
          }
          Path('RELEASE_STATUS.json').write_text(
              json.dumps(status, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          Path('/tmp/ma-sub-v0.1.0-release-status.json').write_text(
              json.dumps(status, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          git add RELEASE_STATUS.json
          git commit -m 'Record v0.1.0 release verification'
          git push origin HEAD:main
          test -z "$(git status --porcelain)"

          cd /tmp
          zip -q ma-sub-v0.1.0-release-status.zip ma-sub-v0.1.0-release-status.json
          cd "$GITHUB_WORKSPACE"
          if gh release view v0.1.0 >/dev/null 2>&1; then
            gh release upload v0.1.0 /tmp/ma-sub-v0.1.0-release-status.zip --clobber
          else
            gh release create v0.1.0 /tmp/ma-sub-v0.1.0-release-status.zip \
              --verify-tag \
              --title 'ma-sub v0.1.0' \
              --notes 'Tested production baseline. Real full-episode GPU inference remains to be validated on RunPod.'
          fi
          echo "Release commit: $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag: v0.1.0" >> "$GITHUB_STEP_SUMMARY"
          echo "Tests: $TEST_SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          echo "Docker test stage: PASS" >> "$GITHUB_STEP_SUMMARY"
