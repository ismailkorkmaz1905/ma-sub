name: Qualify EP14 launch repair
on:
  push:
    branches: [main]
    paths: ['.ep14-stage/**', '.github/workflows/ep14-repair.yml']
permissions:
  contents: write
concurrency:
  group: ma-sub-ep14-launch-repair
  cancel-in-progress: false
jobs:
  qualify:
    if: "contains(github.event.head_commit.message, '[ep14-stage]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core
          pip install -r requirements-ci.lock
          pip install --no-deps -e .
      - name: Apply reviewed patch and verify exact target tree
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, os, subprocess
          from pathlib import Path
          assert subprocess.check_output(['git','rev-parse','HEAD^'], text=True).strip() == 'daf3a5a12d5a3df1e87cccf7339f2423f63e9ea6'
          encoded = ''.join(Path(f'.ep14-stage/chunk-{i}.b64').read_text().strip() for i in range(3))
          compressed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == '181fb6d14de6f0103c37fb99c1d0884eeefbccb105636bd12f850af9007fc545'
          patch = lzma.decompress(compressed)
          assert len(patch) == 72501
          assert hashlib.sha256(patch).hexdigest() == 'cd643b63474a32b78d828fa40f8cc0e68d80c418fcbd0793fa70257d572f1185'
          target = Path(os.environ['RUNNER_TEMP']) / 'ep14-reviewed.patch'
          target.write_bytes(patch)
          subprocess.run(['git','apply','--index','--check','--unidiff-zero',str(target)], check=True)
          subprocess.run(['git','apply','--index','--unidiff-zero',str(target)], check=True)
          subprocess.run(['git','rm','-r','--','.ep14-stage','.github/workflows/ep14-repair.yml'], check=True)
          subprocess.run(['git','diff','--cached','--check'], check=True)
          assert subprocess.check_output(['git','write-tree'], text=True).strip() == '90f433433306581d0194e9e019b6cf723cbe5245'
          PY
      - name: Test real validators and synthetic media without networking or GPU
        env:
          CUDA_VISIBLE_DEVICES: '-1'
          NVIDIA_VISIBLE_DEVICES: none
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ep14-evidence"
          python_path="$(command -v python)"
          sudo --preserve-env=CUDA_VISIBLE_DEVICES,NVIDIA_VISIBLE_DEVICES,HF_HUB_OFFLINE,TRANSFORMERS_OFFLINE,PYTEST_DISABLE_PLUGIN_AUTOLOAD,PYTHONDONTWRITEBYTECODE unshare --net -- bash -c 'ip link set lo up; exec runuser -u runner -- "$@"' -- "$python_path" -m pytest -q -ra -m 'not gpu' --junitxml="$RUNNER_TEMP/ep14-evidence/tests.xml" tests | tee "$RUNNER_TEMP/ep14-evidence/tests.log"
          for script in runpod/*.sh; do bash -n "$script"; done
          python -m compileall -q src/mas
      - uses: docker/setup-buildx-action@v3
      - name: Check Docker definition without building or starting a GPU runtime
        run: docker build --check .
      - name: Commit only the verified target tree
        run: |
          set -euo pipefail
          test "$(git write-tree)" = '90f433433306581d0194e9e019b6cf723cbe5245'
          git diff --exit-code
          git diff --cached --check
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Fix EP14 cleanup, controller readiness and first-part/full delivery'
          git push origin HEAD:refs/heads/main
          echo "TESTED_COMMIT=$(git rev-parse HEAD)"
          echo "TESTED_TREE=$(git rev-parse HEAD^{tree})"
          git rev-parse HEAD > "$RUNNER_TEMP/ep14-evidence/COMMIT"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/ep14-evidence/TREE"
          git archive --format=tar.gz --output="$RUNNER_TEMP/ep14-evidence/source.tar.gz" HEAD
          sha256sum "$RUNNER_TEMP/ep14-evidence/source.tar.gz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ep14-repair-evidence
          path: ${{ runner.temp }}/ep14-evidence/
          retention-days: 7
