name: Qualify EP14 recovery repair
on:
  push:
    branches: [main]
    paths:
      - '.audit-stage/ep14-closure-*.b64'
      - '.github/workflows/ep14-repair.yml'
permissions:
  contents: write
concurrency:
  group: ma-sub-ep14-recovery-repair
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core
          pip install -r requirements-ci.lock
          pip install --no-deps -e .
      - name: Apply exact locally tested patch
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, subprocess
          from pathlib import Path
          encoded = ''.join(Path(f'.audit-stage/ep14-closure-{index}.b64').read_text().strip() for index in range(3))
          compressed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == '0878f70a49d75ebce64481bc07345d979e8554262eefedd74cae73507d57abea'
          patch = lzma.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == '05554f7a3c91cc264ad3698a90f6e6dc95f0c0ae3ad6d56b70b261aa3827a075'
          target = Path(os.environ['RUNNER_TEMP']) / 'ep14-reviewed.patch'
          target.write_bytes(patch)
          subprocess.run(['git', 'apply', '--index', '--check', str(target)], check=True)
          subprocess.run(['git', 'apply', '--index', str(target)], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          allowed = set(['docs/EP14_CODE_AUDIT_2026-09-19.md', 'src/mas/cli.py', 'src/mas/delivery_first.py', 'src/mas/engine/alignment_recovery.py', 'src/mas/engine/forced_align.py', 'src/mas/engine/id_translation.py', 'src/mas/engine/partial_finalize.py', 'src/mas/engine/subtitle_metadata.py', 'src/mas/pipeline.py', 'src/mas/retry_authorization.py', 'src/mas/runpod_controller.py', 'tests/engine/test_alignment_recovery_plan.py', 'tests/engine/test_delivery_first.py', 'tests/engine/test_ep14_metadata_regression.py', 'tests/test_controller_progressive.py', 'tests/test_pipeline_runtime.py', 'tests/test_retry_authorization.py'])
          actual = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          assert actual == allowed, (actual, allowed)
          proof = Path(os.environ['RUNNER_TEMP']) / 'ep14-qualification'
          proof.mkdir()
          names = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          before = {name.decode(): hashlib.sha256(Path(name.decode()).read_bytes()).hexdigest() for name in names if name}
          (proof / 'before.json').write_text(json.dumps(before, sort_keys=True, indent=2))
          (proof / 'PATCH_SHA256').write_text(hashlib.sha256(patch).hexdigest() + '\n')
          PY
      - name: Test Python 3.11 without external network or GPU
        env:
          CUDA_VISIBLE_DEVICES: '-1'
          NVIDIA_VISIBLE_DEVICES: none
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -o pipefail
          python_path="$(command -v python)"
          sudo --preserve-env=CUDA_VISIBLE_DEVICES,NVIDIA_VISIBLE_DEVICES,HF_HUB_OFFLINE,TRANSFORMERS_OFFLINE,PYTEST_DISABLE_PLUGIN_AUTOLOAD,PYTHONDONTWRITEBYTECODE unshare --net -- bash -c 'ip link set lo up; exec runuser -u runner -- "$@"' -- "$python_path" -m pytest -q -ra -m 'not gpu' tests | tee "$RUNNER_TEMP/ep14-qualification/pytest.log"
          for script in runpod/*.sh; do bash -n "$script"; done
      - name: Commit only the unchanged qualified tree
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          proof = Path(os.environ['RUNNER_TEMP']) / 'ep14-qualification'
          before = json.loads((proof / 'before.json').read_text())
          after = {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in before}
          assert before == after, 'Source changed during qualification'
          (proof / 'after.json').write_text(json.dumps(after, sort_keys=True, indent=2))
          subprocess.run(['git', 'diff', '--exit-code'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          PY
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Repair explicit alignment closure recovery and subtitle metadata gates'
          git push origin HEAD:refs/heads/main
          git rev-parse HEAD | tee "$RUNNER_TEMP/ep14-qualification/COMMIT"
          git rev-parse HEAD^{tree} | tee "$RUNNER_TEMP/ep14-qualification/TREE"
          echo 'This qualifies source tests only; no real GPU, Drive readback or perceptual PASS.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ep14-recovery-qualification
          path: ${{ runner.temp }}/ep14-qualification/
          retention-days: 14
