name: final-v0.1.0-gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-v010-gate.yml'

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: ma-sub-v010-final-gate
  cancel-in-progress: false

jobs:
  verify-clean-tag-record:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Settle previous writers and clean temporary release machinery
        shell: bash
        run: |
          set -euo pipefail
          sleep 180
          git fetch origin main --tags
          git reset --hard origin/main
          rm -rf bootstrap
          rm -f .release-probe-20260904
          rm -f tools/repair_v010.py tools/repair_v010_d.py tools/repair_v010_e.py
          rm -f tools/finalize_v010_release.py
          rm -f .github/workflows/bootstrap.yml
          rm -f .github/workflows/release-v0.1.0.yml
          rm -f .github/workflows/repair-release-v010.yml
          rm -f .github/workflows/repair-release-v010c.yml
          rm -f .github/workflows/repair-release-v010e.yml
          rm -f .github/workflows/finalize-v010-release.yml
          rm -f .github/workflows/publish-v010-status-once.yml
          rm -f .github/workflows/publish-v010-release-asset-once.yml
          rm -f .github/workflows/ensure-v010-release.yml
          rm -f .github/workflows/final-v010-gate.yml
          rm -f RELEASE_STATUS.json COMMIT_SHA.txt
          chmod +x mas runpod/bootstrap.sh runpod/preflight.sh
          test -x ./mas
          test -f src/mas/pipeline.py
          test -f src/mas/state.py
          test -f src/mas/packs/build.py
          test -f src/mas/packs/validate.py
          test -f src/mas/subtitle/srt.py
          test -f src/mas/subtitle/validation.py
          test -f rules/SUBTITLE_SPEC.md
          test -f rules/TRANSLATION_SPEC.md
          test -f rules/GLOSSARY.json
          test -f rules/NAMES.json
          test -f runpod/bootstrap.sh
          test -f runpod/preflight.sh
          ! grep -Fq 'GPU source acquisition/ASR CLI wiring remains the v0.1.0 RunPod integration blocker' src/mas/pipeline.py
          grep -Eq 'input_sha256|fingerprint' src/mas/pipeline.py
          grep -Eqi 'immutable' src/mas/packs/validate.py
          git diff --check

      - name: Install exact CPU test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade 'pip==25.0.1'
          python -m pip install 'pytest==8.3.5' 'PyYAML==6.0.2' 'openpyxl==3.1.5'

      - name: Run compile, CLI, doctor, and complete regression suite
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/src${PYTHONPATH:+:$PYTHONPATH}"
          python -m compileall -q src tests
          ./mas --help >/tmp/mas-help.txt
          ./mas doctor | tee /tmp/mas-doctor.txt
          ./mas test | tee /tmp/pytest.txt
          grep -Eq '[0-9]+ passed' /tmp/pytest.txt
          ! grep -Eq '[1-9][0-9]* failed' /tmp/pytest.txt

      - name: Build Docker test stage
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq '^FROM .* AS test$' Dockerfile; then
            docker build --target test -t ma-sub:v0.1.0-test .
          else
            docker build -t ma-sub:v0.1.0-test .
          fi

      - name: Commit exact tested tree and move stable tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ma-sub release gate'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize tested ma-sub v0.1.0 tree'
          fi
          RELEASE_SHA="$(git rev-parse HEAD)"
          TEST_SUMMARY="$(grep -E '[0-9]+ passed' /tmp/pytest.txt | tail -n 1 | sed 's/^[[:space:]]*//')"
          git push origin HEAD:main
          git tag -fa v0.1.0 -m "ma-sub v0.1.0 - $TEST_SUMMARY" "$RELEASE_SHA"
          git push --force origin refs/tags/v0.1.0
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "test_summary=$TEST_SUMMARY" >> "$GITHUB_OUTPUT"

      - name: Record exact release status on main
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          TEST_SUMMARY: ${{ steps.release.outputs.test_summary }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          release_sha = os.environ['RELEASE_SHA']
          tests = os.environ['TEST_SUMMARY']
          status = {
              'repository_status': 'RELEASED',
              'release_commit_sha': release_sha,
              'version': '0.1.0',
              'tag': 'v0.1.0',
              'tests': tests,
              'failed_tests': 0,
              'cli_help': 'PASS',
              'doctor': 'PASS',
              'compileall': 'PASS',
              'offline_interruption_resume': 'PASS',
              'real_source_resume_without_repeating_url': 'PASS',
              'translation_pack_build_and_validation': 'PASS',
              'immutable_field_enforcement': 'PASS',
              'final_srt_renderer': 'PASS',
              'qc_reports': 'PASS',
              'docker_test_stage': 'PASS',
              'gpu_full_episode_inference': 'NOT_RUN',
              'working_tree_clean_at_release': True,
          }
          Path('RELEASE_STATUS.json').write_text(
              json.dumps(status, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          Path('COMMIT_SHA.txt').write_text(release_sha + '\n', encoding='utf-8')
          Path('/tmp/ma-sub-v0.1.0-release-status.json').write_text(
              json.dumps(status, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          git add RELEASE_STATUS.json COMMIT_SHA.txt
          git commit -m 'Record exact v0.1.0 release status'
          git push origin HEAD:main
          test -z "$(git status --porcelain)"

      - name: Publish exact status in GitHub issue and release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          TEST_SUMMARY: ${{ steps.release.outputs.test_summary }}
        run: |
          set -euo pipefail
          TITLE="[ma-sub v0.1.0] ${RELEASE_SHA} - ${TEST_SUMMARY}"
          BODY=$(cat <<EOF
          Repository status: RELEASED
          Commit SHA: ${RELEASE_SHA}
          Version/tag: v0.1.0
          Tests: ${TEST_SUMMARY}; 0 failed
          Docker test stage: PASS
          Real full-episode NVIDIA GPU inference: NOT RUN
          EOF
          )
          EXISTING="$(gh issue list --state open --search '[ma-sub v0.1.0] in:title' --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --title "$TITLE" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --assignee ismailkorkmaz1905
          fi
          cd /tmp
          zip -q ma-sub-v0.1.0-release-status.zip ma-sub-v0.1.0-release-status.json
          cd "$GITHUB_WORKSPACE"
          if gh release view v0.1.0 >/dev/null 2>&1; then
            gh release upload v0.1.0 /tmp/ma-sub-v0.1.0-release-status.zip --clobber
          else
            gh release create v0.1.0 /tmp/ma-sub-v0.1.0-release-status.zip \
              --verify-tag \
              --title 'ma-sub v0.1.0' \
              --notes 'Tested production baseline. Real full-episode GPU inference remains to be validated on RunPod.'
          fi
          echo "Repository status: RELEASED" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit SHA: $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag: v0.1.0" >> "$GITHUB_STEP_SUMMARY"
          echo "Tests: $TEST_SUMMARY; 0 failed" >> "$GITHUB_STEP_SUMMARY"
