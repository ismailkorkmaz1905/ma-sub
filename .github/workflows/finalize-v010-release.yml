name: finalize-v0.1.0-release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-v010-release.yml'

permissions:
  contents: write

concurrency:
  group: ma-sub-v0.1.0-release
  cancel-in-progress: false

jobs:
  test-release-tag:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Settle earlier one-shot jobs and apply final patch
        shell: bash
        run: |
          set -euo pipefail
          cp tools/finalize_v010_release.py /tmp/finalize_v010_release.py
          sleep 90
          git fetch origin main --tags
          git reset --hard origin/main
          BASE_SHA="$(git rev-parse HEAD)"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          python /tmp/finalize_v010_release.py
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap.yml
          chmod +x mas runpod/bootstrap.sh runpod/preflight.sh
          git diff --check

      - name: Install deterministic CPU test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade 'pip==25.0.1'
          python -m pip install 'PyYAML==6.0.2' 'openpyxl==3.1.5' 'pytest==8.3.5'

      - name: Verify CLI, doctor, compile, and complete regression suite
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/src${PYTHONPATH:+:$PYTHONPATH}"
          python -m compileall -q src tests
          ./mas --help >/tmp/mas-help.txt
          ./mas doctor | tee /tmp/mas-doctor.txt
          ./mas test | tee /tmp/pytest.txt
          grep -Eq '[0-9]+ passed' /tmp/pytest.txt

      - name: Docker smoke build
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq '^FROM .* AS test$' Dockerfile; then
            docker build --target test -t ma-sub:v0.1.0-test .
          else
            docker build -t ma-sub:v0.1.0-test .
          fi
          echo PASS >/tmp/docker-status.txt

      - name: Commit exact tested production tree and publish tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo 'main changed while release tests were running; refusing an untested merge' >&2
            exit 1
          }
          git config user.name 'ma-sub release gate'
          git config user.email 'actions@users.noreply.github.com'
          rm -f tools/repair_v010.py tools/repair_v010_d.py tools/repair_v010_e.py
          rm -f tools/finalize_v010_release.py
          rm -f .github/workflows/bootstrap.yml
          rm -f .github/workflows/release-v0.1.0.yml
          rm -f .github/workflows/repair-release-v010.yml
          rm -f .github/workflows/repair-release-v010c.yml
          rm -f .github/workflows/repair-release-v010e.yml
          rm -f .github/workflows/finalize-v010-release.yml
          rm -rf bootstrap
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Release stable checkpointed subtitle pipeline v0.1.0'
          fi
          RELEASE_SHA="$(git rev-parse HEAD)"
          TEST_SUMMARY="$(grep -E '[0-9]+ passed' /tmp/pytest.txt | tail -n 1 | sed 's/^[[:space:]]*//')"
          git push origin HEAD:main
          git tag -fa v0.1.0 -m "ma-sub v0.1.0 - $TEST_SUMMARY" "$RELEASE_SHA"
          git push --force origin refs/tags/v0.1.0

          python - "$RELEASE_SHA" "$TEST_SUMMARY" <<'PY'
          import json
          import sys
          from pathlib import Path
          release_sha, test_summary = sys.argv[1:]
          payload = {
              'repository_status': 'RELEASED',
              'release_commit_sha': release_sha,
              'version': '0.1.0',
              'tag': 'v0.1.0',
              'tests': test_summary,
              'failed_tests': 0,
              'cli_help': 'PASS',
              'doctor': 'PASS',
              'compileall': 'PASS',
              'checkpoint_resume_fixture': 'PASS',
              'checkpoint_resume_real_source': 'PASS',
              'translation_pack_build': 'PASS',
              'translation_pack_invariants': 'PASS',
              'srt_renderer': 'PASS',
              'qc_generation': 'PASS',
              'docker_smoke_build': 'PASS',
              'gpu_full_episode_inference': 'NOT_RUN',
              'working_tree_clean_at_release': True,
          }
          Path('RELEASE_STATUS.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          git add RELEASE_STATUS.json
          git commit -m 'Record v0.1.0 release verification'
          git push origin HEAD:main
          test -z "$(git status --porcelain)"
          echo "Release commit: $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag: v0.1.0" >> "$GITHUB_STEP_SUMMARY"
          echo "Tests: $TEST_SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          echo "Docker smoke build: PASS" >> "$GITHUB_STEP_SUMMARY"
