name: publish-v0.1.0-release-asset-once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v010-release-asset-once.yml'

permissions:
  contents: write

jobs:
  publish-and-clean:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact release-status asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 30
          git fetch origin main --tags
          git reset --hard origin/main
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          payload = {'repository': 'ismailkorkmaz1905/ma-sub', 'main_sha': git('rev-parse', 'origin/main')}
          status = Path('RELEASE_STATUS.json')
          if status.exists():
              payload.update(json.loads(status.read_text(encoding='utf-8')))
          else:
              payload['repository_status'] = 'RELEASE_STATUS_MISSING'
          try:
              payload['tag_commit_sha'] = git('rev-parse', 'v0.1.0^{}')
          except Exception as exc:
              payload['tag_error'] = str(exc)
          out = Path('/tmp/ma-sub-v0.1.0-release-status.json')
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          cd /tmp
          zip -q ma-sub-v0.1.0-release-status.zip ma-sub-v0.1.0-release-status.json
          cd "$GITHUB_WORKSPACE"
          if gh release view v0.1.0 >/dev/null 2>&1; then
            gh release upload v0.1.0 /tmp/ma-sub-v0.1.0-release-status.zip --clobber
          else
            gh release create v0.1.0 /tmp/ma-sub-v0.1.0-release-status.zip \
              --verify-tag \
              --title 'ma-sub v0.1.0' \
              --notes 'Internal production baseline. Real full-episode GPU inference remains to be validated on RunPod.'
          fi
      - name: Delete one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ma-sub release asset cleanup'
          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/workflows/publish-v010-release-asset-once.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Remove one-shot release status asset publisher'
            git push origin HEAD:main
          fi
