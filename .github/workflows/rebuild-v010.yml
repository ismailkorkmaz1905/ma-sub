name: rebuild-v0.1.0

on:
  push:
    branches: [main]
    paths:
      - "release-tools/v010_ops.py"
      - ".github/workflows/rebuild-v010.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ma-sub-v010-release
  cancel-in-progress: false

jobs:
  migrate-test-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.11"
          cache: pip

      - name: Install system and migration dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade "pip==25.0.1"
          python -m pip install "PyYAML==6.0.2"

      - name: Apply V2 production migration
        run: |
          set -euo pipefail
          python release-tools/v010_ops.py
          python - <<'PY'
          from pathlib import Path

          def replace(path_value: str, old: str, new: str) -> None:
              path = Path(path_value)
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"patch anchor missing in {path}: {old[:100]}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          replace(
              "src/mas/config.py",
              '            "subtitle_max_lines": "max_lines",\n            "vad_silence_db": "vad_silence_db",',
              '            "subtitle_max_lines": "max_lines",\n            "subtitle_max_overlap_ms": "max_overlap_ms",\n            "vad_silence_db": "vad_silence_db",',
          )
          replace(
              "src/mas/stages/acquire.py",
              '    selected: Path | None = None\n    acquisition = "existing"\n    if ctx.source_url:',
              '    selected: Path | None = None\n    acquisition = "existing"\n    effective_source_url = ctx.source_url\n    previous_manifest = source_dir / "source_manifest.json"\n    if not effective_source_url and previous_manifest.exists():\n        try:\n            effective_source_url = json.loads(previous_manifest.read_text(encoding="utf-8")).get("source_url")\n        except (OSError, json.JSONDecodeError):\n            effective_source_url = None\n    if ctx.source_url:',
          )
          replace(
              "src/mas/stages/acquire.py",
              '        "source_url": ctx.source_url,',
              '        "source_url": effective_source_url,',
          )
          replace(
              "src/mas/pipeline.py",
              '    if stage.name == "source":\n        if ctx.source_url or ctx.fixture:\n            return {"source_url": ctx.source_url, "fixture": ctx.fixture}\n        rows: list[dict[str, Any]] = []',
              '    if stage.name == "source":\n        effective_source_url = ctx.source_url\n        manifest_path = ctx.root / "source" / "source_manifest.json"\n        if not effective_source_url and manifest_path.exists():\n            try:\n                effective_source_url = json.loads(manifest_path.read_text(encoding="utf-8")).get("source_url")\n            except (OSError, json.JSONDecodeError):\n                effective_source_url = None\n        if effective_source_url or ctx.fixture:\n            return {"source_url": effective_source_url, "fixture": ctx.fixture}\n        rows: list[dict[str, Any]] = []',
          )
          replace(
              "src/mas/pipeline.py",
              '    files = [Path(stage.function.__code__.co_filename), root / "src" / "mas" / "pipeline.py"]',
              '    files = [Path(stage.function.__code__.co_filename)]',
          )
          replace(
              "src/mas/cli.py",
              'def test(pytest_args: list[str]) -> int:\n    command = [sys.executable, "-m", "pytest", *(pytest_args or ["-q"])]',
              'def test(pytest_args: list[str]) -> int:\n    if pytest_args and pytest_args[0] == "--":\n        pytest_args = pytest_args[1:]\n    command = [sys.executable, "-m", "pytest", *(pytest_args or ["-q"])]',
          )
          replace(".github/workflows/test.yml", "./mas test -- -q", "./mas test -q")
          replace(
              "tests/production/test_pipeline_resume.py",
              '    first_source_output = root / state1["stages"]["source"]["outputs"][0]["path"]',
              '    first_source_output = next(root / item["path"] for item in state1["stages"]["source"]["outputs"] if item["path"].endswith("fixture_records.json"))',
          )
          Path("tests/__init__.py").touch()
          Path("tests/production/__init__.py").touch()
          PY
          chmod +x mas runpod/*.sh
          test ! -e bootstrap/READY || true

      - name: Verify V2 inventory and migration output
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("MIGRATION_REPORT.json").read_text())
          source = json.loads(Path("legacy/V2_BETA/SOURCE_MANIFEST.json").read_text())
          assert not source["missing_required"], source["missing_required"]
          assert report["required_v2_files"] >= 12, report
          assert report["rule_source_files_scanned"] >= 10, report
          inventory = Path("rules/V2_RULE_INVENTORY.md").read_text(encoding="utf-8")
          for token in ("block_uid", "block_index", "schema_sha256", "review_required", "speaker", "hallucination"):
              assert token.lower() in inventory.lower(), token
          print(json.dumps(report, indent=2, ensure_ascii=False))
          PY

      - name: Install locked CPU dependencies
        run: python -m pip install -r requirements.lock

      - name: Compile all production and tests
        run: |
          set -euo pipefail
          python -m compileall -q src tests
          ./mas --help
          ./mas doctor
          ./mas clean 999 --dry-run

      - name: Full deterministic regression suite
        run: |
          set -euo pipefail
          ./mas test -q --junitxml=/tmp/pytest.xml | tee /tmp/pytest.log

      - name: Explicit offline interruption and resume proof
        run: |
          set -euo pipefail
          export MAS_HOME=/tmp/ma-sub-release-smoke
          rm -rf "$MAS_HOME"
          set +e
          MAS_FAIL_AFTER_STAGE=asr ./mas run 990 --fixture >/tmp/interrupt.log 2>&1
          interrupted_rc=$?
          set -e
          test "$interrupted_rc" -eq 1
          grep -q "CHECKPOINT PRESERVED: yes" /tmp/interrupt.log
          set +e
          ./mas run 990 --fixture >/tmp/wait-tr.log 2>&1
          wait_tr_rc=$?
          set -e
          test "$wait_tr_rc" -eq 20
          grep -q "GPU WORK COMPLETE" /tmp/wait-tr.log
          python - <<'PY'
          import json, os, zipfile
          from pathlib import Path
          root = Path(os.environ["MAS_HOME"]) / "EPISODES" / "Muhtemel Ask 990.Bolum"
          def rewrite(source, target, kind):
              with zipfile.ZipFile(source) as z:
                  members = {i.filename: z.read(i) for i in z.infolist()}
              records = json.loads(members["records.json"])
              for row in records:
                  if kind == "TR":
                      row["tr_text_corrected"] = row["tr_text"]
                  else:
                      mapping = {"Merhaba Defne.": "Halo Defne.", "Nasılsın?": "Apa kabar?", "250 lira borcum kaldı.": "Utangku tinggal 250 lira."}
                      row["id_text"] = mapping[row["tr_text"]]
              members["records.json"] = (json.dumps(records, ensure_ascii=False, indent=2, sort_keys=True) + "\n").encode()
              target.parent.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(target, "w", zipfile.ZIP_DEFLATED) as z:
                  for name, data in members.items():
                      z.writestr(name, data)
          rewrite(root / "translation_input" / "Muhtemel Ask 990.Bolum_TR_CORRECTION_PACK.zip", root / "translation_output" / "Muhtemel Ask 990.Bolum_TR_TEXT_CORRECTED.zip", "TR")
          PY
          set +e
          ./mas run 990 --fixture >/tmp/wait-id.log 2>&1
          wait_id_rc=$?
          set -e
          test "$wait_id_rc" -eq 21
          python - <<'PY'
          import json, os, zipfile
          from pathlib import Path
          root = Path(os.environ["MAS_HOME"]) / "EPISODES" / "Muhtemel Ask 990.Bolum"
          source = root / "translation_input" / "Muhtemel Ask 990.Bolum_ID_TRANSLATION_PACK.zip"
          target = root / "translation_output" / "Muhtemel Ask 990.Bolum_ID_TRANSLATED.zip"
          with zipfile.ZipFile(source) as z:
              members = {i.filename: z.read(i) for i in z.infolist()}
          records = json.loads(members["records.json"])
          mapping = {"Merhaba Defne.": "Halo Defne.", "Nasılsın?": "Apa kabar?", "250 lira borcum kaldı.": "Utangku tinggal 250 lira."}
          for row in records:
              row["id_text"] = mapping[row["tr_text"]]
          members["records.json"] = (json.dumps(records, ensure_ascii=False, indent=2, sort_keys=True) + "\n").encode()
          target.parent.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(target, "w", zipfile.ZIP_DEFLATED) as z:
              for name, data in members.items():
                  z.writestr(name, data)
          PY
          ./mas run 990 --fixture | tee /tmp/final.log
          grep -q "FINAL STATUS: PASS" /tmp/final.log
          ./mas run 990 --fixture | tee /tmp/resume.log
          grep -q "ASR SKIP checkpoint valid" /tmp/resume.log
          test -s "$MAS_HOME/EPISODES/Muhtemel Ask 990.Bolum/final/subtitles/Muhtemel Ask 990.Bolum-id.srt"
          test -s "$MAS_HOME/EPISODES/Muhtemel Ask 990.Bolum/reports/qc.json"

      - name: Docker CPU smoke build
        run: docker build --build-arg INSTALL_GPU=0 -t ma-sub:v0.1.0 .

      - name: Write release verification evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse("/tmp/pytest.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          result = {
              "version": "0.1.0",
              "tests": int(suite.attrib.get("tests", 0)),
              "failures": int(suite.attrib.get("failures", 0)),
              "errors": int(suite.attrib.get("errors", 0)),
              "skipped": int(suite.attrib.get("skipped", 0)),
              "offline_interruption_resume": "PASS",
              "cli_help": "PASS",
              "doctor_cpu": "PASS",
              "docker_cpu_smoke_build": "PASS",
              "gpu_inference_validated": False,
              "full_episode_validated": False,
              "tag_policy": "Tag is created only after this evidence is written and all prior steps pass.",
          }
          Path("RELEASE_VERIFICATION.json").write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          print(json.dumps(result, indent=2))
          PY

      - name: Commit clean tested tree and tag v0.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf bootstrap release-tools
          rm -f .github/workflows/bootstrap.yml .github/workflows/rebuild-v010.yml
          git config user.name "ma-sub release"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test -z "$(git status --porcelain --untracked-files=no | grep '^ M' || true)"
          if git rev-parse -q --verify refs/tags/v0.1.0 >/dev/null; then
            echo "v0.1.0 already exists; refusing to move a release tag" >&2
            exit 1
          fi
          git commit -m "Release Muhtemel Ask pipeline v0.1.0"
          release_sha="$(git rev-parse HEAD)"
          git tag -a v0.1.0 -m "Muhtemel Ask pipeline v0.1.0" "$release_sha"
          git push origin HEAD:main
          git push origin refs/tags/v0.1.0
          echo "RELEASE_SHA=$release_sha" | tee /tmp/release-sha
