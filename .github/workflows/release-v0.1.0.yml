name: release-v0.1.0

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-v0.1.0.yml']

permissions:
  contents: write

jobs:
  verify-and-tag:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify production release surface
        shell: bash
        run: |
          set -euo pipefail
          test -x ./mas
          test -f src/mas/pipeline.py
          test -f src/mas/state.py
          test -f src/mas/packs/build.py
          test -f src/mas/packs/validate.py
          test -f src/mas/subtitle/srt.py
          test -f src/mas/subtitle/validation.py
          test -f rules/SUBTITLE_SPEC.md
          test -f rules/TRANSLATION_SPEC.md
          test -f rules/GLOSSARY.json
          test -f rules/NAMES.json
          test -f runpod/bootstrap.sh
          test -f runpod/preflight.sh
          ! grep -Fq 'GPU source acquisition/ASR CLI wiring remains the v0.1.0 RunPod integration blocker' src/mas/pipeline.py
          grep -Eqi 'checkpoint|fingerprint|input_sha256' src/mas/pipeline.py
          grep -Eqi 'immutable' src/mas/packs/validate.py
      - name: Install CPU regression dependencies
        run: python -m pip install PyYAML==6.0.2 openpyxl==3.1.5 pytest==8.3.5
      - name: Compile and test
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/src${PYTHONPATH:+:$PYTHONPATH}"
          python -m compileall -q src tests
          ./mas --help >/dev/null
          ./mas test
      - name: Docker test-stage build
        run: docker build --target test -t ma-sub:v0.1.0-test .
      - name: Remove one-shot gate and create stable tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ma-sub release gate'
          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/workflows/release-v0.1.0.yml
          git add -A
          git commit -m 'Remove one-shot v0.1.0 release gate'
          git push origin HEAD:main
          if git rev-parse -q --verify refs/tags/v0.1.0 >/dev/null; then
            test "$(git rev-parse 'v0.1.0^{tree}')" = "$(git rev-parse 'HEAD^{tree}')"
          else
            git tag -a v0.1.0 -m 'ma-sub v0.1.0'
            git push origin refs/tags/v0.1.0
          fi
          echo "Commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag: v0.1.0" >> "$GITHUB_STEP_SUMMARY"
