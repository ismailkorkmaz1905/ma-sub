          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/workflows/repair-release-v010.yml .github/workflows/release-v0.1.0.yml
          git add -A
          if ! git diff --cached --quiet; then git commit -m 'Finalize checkpointed production pipeline v0.1.0'; fi
          git push origin HEAD:main
          if git rev-parse -q --verify refs/tags/v0.1.0 >/dev/null; then
