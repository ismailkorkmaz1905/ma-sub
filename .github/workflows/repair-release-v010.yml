                  issues=qc(rows); missing=sum(1 for r in rows if not str(r.get('id_text') or '').strip()); fatal=missing or any(x['type'] in {'invalid_duration','duplicate_block_uid','missing_text'} for x in issues); status='FAIL' if fatal else ('PASS_WITH_REVIEW' if issues or any(r.get('review_required') for r in rows) else 'PASS'); report={'status':status,'episode':ep,'source_duration_ms':max((r['end_ms'] for r in rows),default=0),'asr_block_count':len(data(raw)),'final_subtitle_block_count':len(rows),'missing_translations':missing,'unresolved_review_items':sum(1 for r in rows if r.get('review_required') and not r.get('audio_reviewed')),'issues':issues,'immutable_field_validation':'PASS','pipeline_version':PIPELINE_VERSION,'schema_version':SCHEMA_VERSION,'rules_version':RULES_VERSION,'input_output_hashes':{'source':sha256_file(source),'tr_return':sha256_file(trr),'id_return':sha256_file(idr)},'runtime_seconds_by_stage':{k:v.get('runtime_seconds') for k,v in state['stages'].items()}}; dump(qj,report); qm.write_text(f"# QC report\n\nStatus: {status}\n\nFinal blocks: {len(rows)}\nIssues: {len(issues)}\n",encoding='utf-8'); return {'status':status}
              complete(state,sp,'qc',sha256_file(final),cfg,[qj,qm],fq); result=data(qj); print(f"[9/9] QC {result['status']}"); return 2 if result['status']=='FAIL' else 0
          def status(ep): print(json.dumps(load(dirs(ep)/'work/state.json',ep),ensure_ascii=False,indent=2)); return 0
          ''')
          w('src/mas/cli.py', '''
          import argparse,os,platform,shutil,subprocess,sys,traceback
          from .config import episode_dir,repo_root
          from .pipeline import run,status
          from .version import PIPELINE_VERSION
          def doctor():
              checks={x:bool(shutil.which(x)) for x in ('python','ffmpeg','ffprobe','git','yt-dlp')}; checks['python_version']=platform.python_version(); checks['pipeline_version']=PIPELINE_VERSION
              try: import torch; checks['torch']=torch.__version__; checks['cuda_available']=torch.cuda.is_available()
              except Exception: checks['torch']='not installed'; checks['cuda_available']=False
              for k,v in checks.items(): print(f'{k}: {v}')
              return 1 if not checks['ffmpeg'] or not checks['ffprobe'] else 0
          def test():
              env=os.environ.copy(); env['PYTHONPATH']=str(repo_root()/'src')+os.pathsep+env.get('PYTHONPATH',''); return subprocess.call([sys.executable,'-m','pytest','-q'],cwd=repo_root(),env=env)
          def clean(ep,destroy=False):
              d=episode_dir(ep)
              for p in (d/'work/audio_review',d/'work/captions'):
                  print(('DELETE ' if destroy else 'DRY-RUN ')+str(p)); shutil.rmtree(p) if destroy and p.exists() else None
