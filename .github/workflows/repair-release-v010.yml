                      if s.get('no_speech_prob') is not None and s['no_speech_prob']>0.75: flags.append('suspected_asr_hallucination')
                      if int(s['start_ms'])<last: flags.append('timing_overlap')
                      uid=f"b{i+1:06d}-{uuid.uuid5(uuid.NAMESPACE_URL,f'{s["start_ms"]}:{s["end_ms"]}:{text}').hex[:12]}"
                      out.append({'block_uid':uid,'block_index':i+1,'start_ms':int(s['start_ms']),'end_ms':int(s['end_ms']),'tr_text':text,'id_text':'','words':s.get('words',[]),'speaker':s.get('speaker'),'provenance':['asr'],'asr_audit':{'avg_logprob':s.get('avg_logprob'),'no_speech_prob':s.get('no_speech_prob'),'source_segment_index':s.get('segment_index',i)},'review_required':bool(flags),'review_flags':flags,'audio_reviewed':False,'review_disposition':None}); last=max(last,int(s['end_ms']))
                  dump(rec,out); dump(d/'work/review_required.json',[x for x in out if x['review_required']]); return {'count':len(out)}
              complete(state,sp,'reconcile',sha256_file(raw),cfg,[rec,d/'work/review_required.json'],fr); base=data(rec)
              trz=d/'translation_input'/f'{name}_TR_CORRECTION_PACK.zip'; trp=d/'translation_input/TR_PROMPT.txt'; trm=d/'work/tr_manifest.json'
              def ftp():
                  p=prompt(ep,'TR',trz.name); trp.write_text(p,encoding='utf-8'); dump(trm,build_pack(trz,ep,'TR',base,p)); return {'count':len(base)}
              complete(state,sp,'tr_pack',sha256_file(rec),cfg,[trz,trp,trm],ftp); trr=d/'translation_output'/f'{name}_TR_TEXT_CORRECTED.zip'
              if not trr.exists(): state['waiting_for']={'stage':'TR_CORRECTION','file':trr.name}; save(sp,state); print(f'[WAIT] TR CORRECTION\nGPU WORK COMPLETE\nSafe to stop RunPod now.\n\nWaiting for:\n{trr.name}'); return 20
              corrected=d/'work/records_tr_corrected.json'; complete(state,sp,'tr_return',sha256_json([sha256_file(trr),sha256_file(trm)]),cfg,[corrected],lambda:dump(corrected,validate_returned(trr,data(trm),base))); cor=data(corrected); state.pop('waiting_for',None); save(sp,state)
              aligned=d/'work/records_aligned.json'
              def falign():
                  rows=[]
                  for r in cor: x=dict(r); x['provenance']=list(dict.fromkeys(x.get('provenance',[])+['corrected_turkish','asr_word_timing'])); rows.append(x)
                  dump(aligned,rows)
              complete(state,sp,'align',sha256_file(corrected),cfg,[aligned],falign); ar=data(aligned)
              idz=d/'translation_input'/f'{name}_ID_TRANSLATION_PACK.zip'; idp=d/'translation_input/ID_PROMPT.txt'; idm=d/'work/id_manifest.json'
              def fip():
                  p=prompt(ep,'ID',idz.name); idp.write_text(p,encoding='utf-8'); dump(idm,build_pack(idz,ep,'ID',ar,p)); return {'count':len(ar)}
              complete(state,sp,'id_pack',sha256_file(aligned),cfg,[idz,idp,idm],fip); idr=d/'translation_output'/f'{name}_ID_TRANSLATED.zip'
              if not idr.exists(): state['waiting_for']={'stage':'ID_TRANSLATION','file':idr.name}; save(sp,state); print(f'[WAIT] ID TRANSLATION\nGPU NOT REQUIRED\n\nWaiting for:\n{idr.name}'); return 21
              final=d/'work/records_final.json'; complete(state,sp,'id_return',sha256_json([sha256_file(idr),sha256_file(idm)]),cfg,[final],lambda:dump(final,validate_returned(idr,data(idm),ar))); rows=data(final); state.pop('waiting_for',None); save(sp,state)
              trs=d/'final/subtitles'/f'{name}-tr.srt'; ids=d/'final/subtitles'/f'{name}-id.srt'
              def ff(): trs.write_text(render(rows,'tr_text'),encoding='utf-8'); ids.write_text(render(rows,'id_text'),encoding='utf-8')
              complete(state,sp,'finalize',sha256_json([sha256_file(final),sha256_file(source)]),cfg,[trs,ids],ff)
