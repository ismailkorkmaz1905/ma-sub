              except Exception as e:
                  state['stages'][name]={'status':'failed','input_sha256':input_hash,'config_sha256':cfg,'error':str(e),'failed_at':now()}; save(sp,state); raise
          def acquire(d,url,fixture):
              if fixture: p=d/'source/fixture.source'; p.write_text('fixture\n'); return p
              vids=sorted(p for p in (d/'source').iterdir() if p.suffix.lower() in {'.mkv','.mp4','.webm','.mov'})
              if vids: return vids[0]
              if not url: raise RuntimeError('No source media. Pass --source-url once or place video in source/.')
              local=Path(url[7:] if url.startswith('file://') else url).expanduser()
              if local.exists(): target=d/'source'/local.name; shutil.copy2(local,target); return target
              if not shutil.which('yt-dlp'): raise RuntimeError('yt-dlp unavailable')
              subprocess.run(['yt-dlp','--no-playlist','--merge-output-format','mkv','-o',str(d/'source/source.%(ext)s'),url],check=True)
              return next(p for p in (d/'source').glob('source.*') if p.suffix not in {'.part','.log'})
          def asr(audio,out,fixture):
