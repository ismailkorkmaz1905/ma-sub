name: repair-and-release-v0.1.0

on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-release-v010.yml']

permissions:
  contents: write

jobs:
  repair-test-tag:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Repair production wrapper only when required
        shell: bash
        run: |
          set -euo pipefail
          if test -f src/mas/pipeline.py \
             && ! grep -Fq 'GPU source acquisition/ASR CLI wiring remains the v0.1.0 RunPod integration blocker' src/mas/pipeline.py \
             && grep -Eqi 'checkpoint|input_sha256|fingerprint' src/mas/pipeline.py \
             && test -f rules/TRANSLATION_SPEC.md \
             && test -f rules/GLOSSARY.json \
             && test -f rules/NAMES.json \
             && test -f runpod/preflight.sh; then
            echo 'Existing production wrapper is complete; no repair needed.'
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          import textwrap
          def w(path, text, mode=None):
              p=Path(path); p.parent.mkdir(parents=True,exist_ok=True); p.write_text(textwrap.dedent(text).lstrip(),encoding='utf-8')
              if mode is not None: p.chmod(mode)
          w('src/mas/version.py', '''
          PIPELINE_VERSION='0.1.0'
          SCHEMA_VERSION='mas.subtitle.v2'
          RULES_VERSION='v2-beta-2026-09-04'
          ''')
          w('src/mas/config.py', '''
          import os
          from pathlib import Path
          def repo_root(): return Path(__file__).resolve().parents[2]
          def workspace_root(): return Path(os.environ.get('MAS_WORKSPACE',repo_root())).expanduser().resolve()
          def episode_name(ep): return f'Muhtemel Ask {ep}.Bolum'
          def episode_dir(ep): return workspace_root()/'EPISODES'/episode_name(ep)
          def rules_dir(): return repo_root()/'rules'
          ''')
          w('src/mas/hashing.py', '''
          import hashlib,json
          from pathlib import Path
          def sha256_file(path):
              h=hashlib.sha256()
              with Path(path).open('rb') as f:
                  for b in iter(lambda:f.read(1048576),b''): h.update(b)
              return h.hexdigest()
          def canonical(v): return json.dumps(v,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()
          def sha256_json(v): return hashlib.sha256(canonical(v)).hexdigest()
          ''')
          w('src/mas/errors.py', '''
          class MasError(RuntimeError): pass
          class PackageValidationError(MasError): pass
          ''')
          w('src/mas/state.py', '''
          import json,os,tempfile
          from datetime import datetime,timezone
          from pathlib import Path
          from .hashing import sha256_file
          from .version import PIPELINE_VERSION,SCHEMA_VERSION,RULES_VERSION
          def now(): return datetime.now(timezone.utc).isoformat()
          def load(path,ep):
              if not Path(path).exists(): return {'episode':ep,'pipeline_version':PIPELINE_VERSION,'schema_version':SCHEMA_VERSION,'rules_version':RULES_VERSION,'stages':{},'created_at':now()}
              try: s=json.loads(Path(path).read_text(encoding='utf-8'))
              except Exception as e: raise RuntimeError(f'Corrupted state: {path}: {e}') from e
              if s.get('episode')!=ep: raise RuntimeError(f"State episode mismatch: expected {ep}, got {s.get('episode')}")
              s.setdefault('stages',{}); return s
          def save(path,s):
              path=Path(path); path.parent.mkdir(parents=True,exist_ok=True); s['updated_at']=now(); fd,tmp=tempfile.mkstemp(dir=path.parent,prefix=path.name+'.')
              try:
                  with os.fdopen(fd,'w',encoding='utf-8') as f: json.dump(s,f,ensure_ascii=False,indent=2,sort_keys=True); f.write('\n'); f.flush(); os.fsync(f.fileno())
                  os.replace(tmp,path)
              finally:
                  if os.path.exists(tmp): os.unlink(tmp)
          def valid(stage,input_hash,config_hash,outputs):
              if stage.get('status')!='complete' or stage.get('input_sha256')!=input_hash or stage.get('config_sha256')!=config_hash: return False
              hashes=stage.get('outputs',{})
              return all(Path(p).exists() and hashes.get(str(Path(p)))==sha256_file(p) for p in outputs)
          ''')
          w('src/mas/packs/build.py', '''
          import json,zipfile
          from pathlib import Path
          from ..hashing import sha256_json
          from ..version import PIPELINE_VERSION,SCHEMA_VERSION,RULES_VERSION
          IMMUTABLE_FIELDS=['block_uid','block_index','start_ms','end_ms','asr_audit','audio_reviewed','review_disposition','schema_version','schema_sha256']
          def descriptor(kind): return {'schema_version':SCHEMA_VERSION,'kind':kind,'immutable_fields':IMMUTABLE_FIELDS,'editable_field':'tr_text' if kind=='TR' else 'id_text'}
          def build_pack(path,episode,kind,records,prompt_text=''):
              path=Path(path); path.parent.mkdir(parents=True,exist_ok=True); kind=kind.upper(); schema=descriptor(kind); sh=sha256_json(schema); rows=[]
              for r in records:
                  x=dict(r); x['schema_version']=SCHEMA_VERSION; x['schema_sha256']=sh; rows.append(x)
              manifest={'episode':episode,'kind':kind,'pipeline_version':PIPELINE_VERSION,'rules_version':RULES_VERSION,'schema_version':SCHEMA_VERSION,'schema_sha256':sh,'input_sha256':sha256_json(rows),'record_count':len(rows),'immutable_fields':IMMUTABLE_FIELDS,'records_file':'records.json'}
              with zipfile.ZipFile(path,'w',zipfile.ZIP_DEFLATED) as z:
                  z.writestr('manifest.json',json.dumps(manifest,ensure_ascii=False,indent=2,sort_keys=True)+'\n'); z.writestr('records.json',json.dumps(rows,ensure_ascii=False,indent=2)+'\n'); z.writestr('INSTRUCTIONS.md',prompt_text)
              return manifest
          ''')
          w('src/mas/packs/validate.py', '''
          import json,zipfile
          from pathlib import Path
          from .build import IMMUTABLE_FIELDS
          from ..errors import PackageValidationError
          def read(path):
              try:
                  with zipfile.ZipFile(path) as z:
                      if not {'manifest.json','records.json'}<=set(z.namelist()): raise PackageValidationError('ZIP must contain manifest.json and records.json')
                      return json.loads(z.read('manifest.json')),json.loads(z.read('records.json'))
              except PackageValidationError: raise
              except Exception as e: raise PackageValidationError(f'Invalid ZIP: {e}') from e
          def validate_returned(path,expected_manifest,expected_records):
              m,rows=read(path)
              for k in ('episode','kind','schema_version','schema_sha256','input_sha256','record_count'):
                  if m.get(k)!=expected_manifest.get(k): raise PackageValidationError(f'{k} mismatch: expected {expected_manifest.get(k)!r}, got {m.get(k)!r}')
              if len(rows)!=len(expected_records): raise PackageValidationError(f'record count mismatch: expected {len(expected_records)}, got {len(rows)}')
              seen=set()
              for i,(a,b) in enumerate(zip(expected_records,rows)):
                  if not isinstance(b,dict): raise PackageValidationError(f'record {i} is not an object')
                  if b.get('block_uid')!=a.get('block_uid'): raise PackageValidationError(f'block_uid/order changed at record {i}')
                  if b.get('block_index')!=a.get('block_index'): raise PackageValidationError(f'block_index/order changed at record {i}')
                  for k in IMMUTABLE_FIELDS:
                      if k in a and b.get(k)!=a.get(k): raise PackageValidationError(f'immutable field changed at record {i}, uid={a.get("block_uid")}: {k}')
                  if b.get('block_uid') in seen: raise PackageValidationError('duplicate block_uid in returned package')
                  seen.add(b.get('block_uid'))
              return rows
          ''')
          w('src/mas/subtitle/srt.py', '''
          import re
          def stamp(ms):
              ms=max(0,int(ms)); h,ms=divmod(ms,3600000); m,ms=divmod(ms,60000); s,ms=divmod(ms,1000); return f'{h:02d}:{m:02d}:{s:02d},{ms:03d}'
          def render(records,field='id_text'):
              out=[]
              for r in records:
                  text=re.sub(r'(?im)^\\s*(speaker|konuşmacı)\\s*\\w*\\s*:\\s*','',str(r.get(field) or '').replace('\\r','').strip())
                  if not text: continue
                  out += [str(len(out)//4+1),f"{stamp(r['start_ms'])} --> {stamp(r['end_ms'])}",text,'']
              return '\n'.join(out).rstrip()+'\n'
          ''')
          w('src/mas/subtitle/validation.py', '''
          import re
          DEFAULT={'min_duration_ms':500,'max_duration_ms':8000,'max_cps':22.0,'max_line_length':42,'max_lines':2}
          def qc(records,thresholds=None):
              t={**DEFAULT,**(thresholds or {})}; issues=[]; last=-1; seen=set()
              for r in records:
                  uid=r.get('block_uid'); start=int(r.get('start_ms',-1)); end=int(r.get('end_ms',-1)); text=str(r.get('id_text') or r.get('tr_text') or '')
                  def add(kind,**x): issues.append({'type':kind,'block_uid':uid,'block_index':r.get('block_index'),**x})
                  if uid in seen: add('duplicate_block_uid')
                  seen.add(uid)
                  if end<=start: add('invalid_duration')
                  dur=end-start
                  if dur<t['min_duration_ms']: add('too_short',duration_ms=dur)
                  if dur>t['max_duration_ms']: add('too_long',duration_ms=dur)
                  if start<last: add('overlap',previous_end_ms=last,start_ms=start)
                  last=max(last,end)
                  if not text.strip(): add('missing_text')
                  cps=len(re.sub(r'\\s+','',text))/(dur/1000) if dur>0 else 999
                  if cps>t['max_cps']: add('cps',cps=round(cps,2))
                  lines=text.splitlines() or ['']
                  if len(lines)>t['max_lines']: add('too_many_lines')
                  if max(map(len,lines))>t['max_line_length']: add('line_too_long')
                  if re.search(r'(?i)^\\s*(speaker|konuşmacı)\\b',text): add('speaker_label_leak')
              return issues
          ''')
          w('src/mas/pipeline.py', '''
          import json,os,re,shutil,subprocess,time,uuid
          from pathlib import Path
          from .config import episode_dir,episode_name,rules_dir
          from .hashing import sha256_file,sha256_json
          from .state import load,save,valid,now
          from .packs.build import build_pack
          from .packs.validate import validate_returned
          from .subtitle.srt import render
          from .subtitle.validation import qc
          from .version import PIPELINE_VERSION,SCHEMA_VERSION,RULES_VERSION
          ORDER=['source','audio','asr','reconcile','tr_pack','tr_return','align','id_pack','id_return','finalize','qc']
          def dirs(ep):
              d=episode_dir(ep)
              for x in ('source','work','translation_input','translation_output','reports','final/subtitles','logs'): (d/x).mkdir(parents=True,exist_ok=True)
              return d
          def dump(p,v): p=Path(p); p.parent.mkdir(parents=True,exist_ok=True); p.write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          def data(p): return json.loads(Path(p).read_text(encoding='utf-8'))
