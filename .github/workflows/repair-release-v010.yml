          def complete(state,sp,name,input_hash,cfg,outputs,fn):
              if valid(state['stages'].get(name,{}),input_hash,cfg,outputs): print(f'[SKIP] {name.upper()} checkpoint valid'); return
              for n in ORDER[ORDER.index(name)+1:]: state['stages'].pop(n,None)
