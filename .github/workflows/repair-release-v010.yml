                  rows=[{'segment_index':0,'start_ms':1000,'end_ms':2500,'text':'Merhaba Defne.','words':[]},{'segment_index':1,'start_ms':2800,'end_ms':4300,'text':'Nasılsın?','words':[]}]; dump(out,rows); return {'engine':'fixture','count':2}
              try: from faster_whisper import WhisperModel
              except Exception as e: raise RuntimeError('faster-whisper unavailable; run runpod/bootstrap.sh') from e
              model=WhisperModel(os.environ.get('MAS_ASR_MODEL','large-v3'),device='cuda',compute_type='float16'); segs,info=model.transcribe(str(audio),language='tr',word_timestamps=True,vad_filter=True,beam_size=5,condition_on_previous_text=False); rows=[]
              for i,s in enumerate(segs):
                  rows.append({'segment_index':i,'start_ms':round(s.start*1000),'end_ms':round(s.end*1000),'text':s.text.strip(),'avg_logprob':getattr(s,'avg_logprob',None),'no_speech_prob':getattr(s,'no_speech_prob',None),'words':[{'word':w.word,'start_ms':round(w.start*1000),'end_ms':round(w.end*1000),'probability':w.probability} for w in (s.words or [])]})
                  if len(rows)%100==0: dump(out,rows)
              dump(out,rows); return {'engine':'faster-whisper','model':os.environ.get('MAS_ASR_MODEL','large-v3'),'count':len(rows)}
          def prompt(ep,kind,name):
              specs='\n\n'.join((rules_dir()/x).read_text(encoding='utf-8') for x in ('TRANSLATION_SPEC.md','SUBTITLE_SPEC.md') if (rules_dir()/x).exists())
              return f'# Muhtemel Ask episode {ep} - {kind}\n\nWork only inside `{name}`. Return the exact requested ZIP. Do not change timing, order, count, UID, index, audit, schema, or hashes. Do not invent audio-dependent text.\n\n{specs}\n'
          def run(ep,source_url=None,fixture=False,stop_after=None):
              d=dirs(ep); sp=d/'work/state.json'; state=load(sp,ep); cfg=fingerprint(); name=episode_name(ep); marker=d/'work/source.json'
              existing=[(p.name,sha256_file(p)) for p in sorted((d/'source').glob('*')) if p.is_file()]; ih=sha256_json({'url':source_url or '', 'files':existing, 'fixture':fixture})
              def fs():
