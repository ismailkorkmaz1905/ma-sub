                      subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-i',str(source),'-vn','-ac','1','-ar','16000','-c:a','pcm_s16le',str(audio)],check=True)
              complete(state,sp,'audio',sha256_file(source),cfg,[audio],fa)
              raw=d/'work/asr.json'; complete(state,sp,'asr',sha256_file(audio),cfg,[raw],lambda:asr(audio,raw,fixture))
              if stop_after=='asr': raise RuntimeError('Intentional test interruption after ASR')
