name: final-repair-release-v0.1.0

on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-release-v010e.yml']

permissions:
  contents: write

jobs:
  test-and-tag:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply deterministic repairs
        shell: bash
        run: |
          set -euo pipefail
          test ! -f tools/repair_v010.py || python tools/repair_v010.py
          python tools/repair_v010_d.py
          python tools/repair_v010_e.py
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap.yml
          chmod +x mas runpod/bootstrap.sh runpod/preflight.sh
      - name: Compile and run complete CPU regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install PyYAML==6.0.2 openpyxl==3.1.5 pytest==8.3.5
          export PYTHONPATH="$PWD/src${PYTHONPATH:+:$PYTHONPATH}"
          python -m compileall -q src tests
          ./mas --help >/dev/null
          ./mas test | tee /tmp/pytest.txt
      - name: Docker smoke build
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq '^FROM .* AS test$' Dockerfile; then
            docker build --target test -t ma-sub:v0.1.0-test .
          else
            docker build -t ma-sub:v0.1.0-test .
          fi
      - name: Commit tested tree and publish stable tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ma-sub release gate'
          git config user.email 'actions@users.noreply.github.com'
          rm -f tools/repair_v010.py tools/repair_v010_d.py tools/repair_v010_e.py
          rm -f .github/workflows/repair-release-v010.yml
          rm -f .github/workflows/repair-release-v010c.yml
          rm -f .github/workflows/repair-release-v010e.yml
          rm -f .github/workflows/release-v0.1.0.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Release stable checkpointed subtitle pipeline v0.1.0'
          fi
          git push origin HEAD:main
          if git rev-parse -q --verify refs/tags/v0.1.0 >/dev/null; then
            test "$(git rev-parse 'v0.1.0^{tree}')" = "$(git rev-parse 'HEAD^{tree}')"
          else
            git tag -a v0.1.0 -m 'ma-sub v0.1.0'
            git push origin refs/tags/v0.1.0
          fi
          test -z "$(git status --porcelain)"
          echo "main_commit=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "tag_commit=$(git rev-parse 'v0.1.0^{}')" >> "$GITHUB_STEP_SUMMARY"
          tail -n 1 /tmp/pytest.txt >> "$GITHUB_STEP_SUMMARY"
