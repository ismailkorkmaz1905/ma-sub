name: upload-v0.1.0-status-artifact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upload-v010-status-artifact.yml'

permissions:
  contents: write

jobs:
  upload-and-clean:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for final release status
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            git fetch origin main --tags
            git reset --hard origin/main
            if test -s RELEASE_STATUS.json && test -s COMMIT_SHA.txt; then
              exit 0
            fi
            sleep 10
          done
          echo 'Release status files did not appear' >&2
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: ma-sub-v0.1.0-release-status
          path: |
            RELEASE_STATUS.json
            COMMIT_SHA.txt
          if-no-files-found: error
          retention-days: 7
      - name: Delete one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ma-sub status artifact cleanup'
          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/workflows/upload-v010-status-artifact.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Remove one-shot release status artifact uploader'
            git push origin HEAD:main
          fi
